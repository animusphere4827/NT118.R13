openapi: 3.0.3
info:
  title: TOEIC Studio API
  version: 2.3.0
  description: Core authentication and learning API (PostgreSQL, Vocabulary + TOEIC Reading Part 5-7). Admin resource fields and CRUD are described by /admin/meta and API.md.
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: App and PostgreSQL ready}
        '500': {description: Database unavailable}
  /auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 128}
                full_name: {type: string, maxLength: 150}
      responses:
        '201': {description: Student created}
        '409': {description: Email exists}
        '422': {description: Invalid input}
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email,password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 128}
      responses:
        '200':
          description: Session tokens and user with HttpOnly browser cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {description: Invalid credentials or inactive user}
  /auth/firebase:
    post:
      security: []
      description: Google sign-in through Firebase Authentication. Server verifies the Firebase ID token (RS256, Google public keys, aud = FIREBASE_PROJECT_ID) and returns the app JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: {type: string, description: Firebase ID token from getIdToken()}
      responses:
        '200': {description: 'Existing or newly linked account: {token,user,is_new_user:false}'}
        '201': {description: 'New STUDENT account created: {token,user,is_new_user:true}'}
        '401': {description: Invalid/expired token, not Google provider, unverified email or inactive account}
        '409': {description: Email linked to another Google account, or admin account}
        '503': {description: FIREBASE_PROJECT_ID not configured}
  /auth/refresh:
    post:
      security: []
      description: Rotate a refresh token. Reusing a consumed token revokes its session. Browser clients may use the HttpOnly refresh cookie.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: {type: string, minLength: 64, maxLength: 64}
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {description: Missing, expired, revoked or reused refresh token}
        '403': {description: Missing browser CSRF header or forbidden origin}
        '422': {description: Invalid request body}
  /auth/password/forgot:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: 'Generic response for any email: expires_in 300 and resend_after 60'}
        '422': {description: Invalid email}
        '429': {description: Too many requests}
        '503': {description: SMTP not configured}
  /auth/password/verify:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: {type: string, format: email}
                otp: {type: string, pattern: '^\d{6}$'}
      responses:
        '200': {description: 'Single-use reset_token and expires_in 300'}
        '400': {description: Incorrect, consumed or expired OTP}
        '429': {description: Attempt limit reached}
  /auth/password/reset:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, password]
              properties:
                reset_token: {type: string, pattern: '^[a-f0-9]{64}$'}
                password: {type: string, minLength: 12, maxLength: 128}
      responses:
        '204': {description: Password changed and all previous sessions revoked}
        '400': {description: Invalid, expired or consumed reset token}
        '422': {description: Invalid password}
  /auth/me/avatar:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: {type: string, format: binary, description: JPEG PNG or WebP up to 2 MiB and 16 million decoded pixels}
      responses:
        '200': {description: 'Updated avatar_url and user; output is sanitized WebP'}
        '413': {description: File too large}
        '422': {description: Invalid image content}
        '503': {description: Storage not configured}
  /media/avatars/{file}:
    get:
      security: []
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Public avatar image served through the API from private storage}
        '404': {description: No current avatar with this id}
  /auth/me:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name, target_score]
              properties:
                full_name: {type: string, minLength: 1, maxLength: 150}
                target_score: {type: integer, minimum: 5, maximum: 495}
                avatar_url: {type: string, nullable: true}
      responses:
        '200': {description: Updated public user}
        '401': {description: Login required}
        '422': {description: Invalid profile or avatar ownership}
    get:
      responses:
        '200': {description: Current user without password hash}
        '401': {description: Login required}
  /auth/logout:
    post:
      responses:
        '204': {description: Current session revoked and both browser cookies cleared}
  /admin/meta:
    get:
      responses:
        '200': {description: CRUD form metadata and read-only resources}
        '403': {description: Admin required}
  /admin/dashboard:
    get:
      responses:
        '200': {description: Counts, performance, activity, Part coverage, audit log}
        '403': {description: Admin required}
  /learn/catalog/{resource}:
    get:
      parameters:
        - {name: resource, in: path, required: true, schema: {type: string, enum: [vocabulary_topics, vocabularies, grammar_topics, grammar_lessons, toeic_parts, practice_sets, mock_tests]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: topic_id, in: query, schema: {type: integer}}
        - {name: part_id, in: query, schema: {type: integer}}
      responses:
        '200': {description: Published records with pagination}
  /learn/{kind}/{id}/attempts:
    post:
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {$ref: '#/components/parameters/Id'}
      responses:
        '201': {description: 'Immutable snapshot created: {id,started_at,deadline_at,answer_version,server_time}'}
        '404': {description: Unpublished or missing content}
        '409': {description: Content is not ready}
  /learn/{kind}/attempts:
    get:
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: content_id, in: query, schema: {type: integer, minimum: 1, maximum: 2147483647}}
        - {name: status, in: query, schema: {type: string, enum: [IN_PROGRESS, SUBMITTED]}}
      responses:
        '200': {description: '{rows,total,page,limit}; own history, newest first'}
  /learn/{kind}/attempts/{id}:
    get:
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {description: 'Attempt, server_time and questions including draft labels/review flags. Expired attempts finalize on read; answer keys appear only after submission'}
        '404': {description: Missing or not owned by current user}
  /learn/{kind}/attempts/{id}/submit:
    post:
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                answer_version: {type: integer, minimum: 0, description: Optional optimistic draft version}
                answers:
                  type: array
                  maxItems: 200
                  default: []
                  items:
                    type: object
                    additionalProperties: false
                    required: [question_id,label]
                    properties:
                      question_id: {type: integer, minimum: 1}
                      label: {type: string, enum: [A,B,C,D,null], nullable: true}
      responses:
        '200': {description: 'Immutable result with attempt_id,kind,correct_count,total_questions,accuracy,by_part,expired,score_note; mock adds part5_correct/part6_correct/part7_correct. Retries return the same result. Late bodies are ignored; saved drafts are retained. Not ETS scaled score'}
        '409': {description: Stale answer_version; reload the attempt}
        '422': {description: Invalid, duplicate or foreign answers}
  /admin/notifications/broadcast:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                type: {type: string, enum: [SYSTEM, STUDY_REMINDER, NEW_CONTENT], default: SYSTEM}
                title: {type: string, maxLength: 200}
                body: {type: string, maxLength: 5000}
                data: {type: object, description: App navigation payload}
                user_ids: {type: array, items: {type: integer}, description: Omit to send to all active students}
      responses:
        '201': {description: 'Number of notifications created: {sent}'}
        '403': {description: Admin required}
  /learn/dictionary:
    get:
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 150}}
      responses:
        '200': {description: Up to 20 published words starting with q (case-insensitive)}
  /learn/decks:
    get:
      responses:
        '200': {description: Current user's decks with card_count, due_count, pinned_count}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Deck'}
      responses:
        '201': {description: Deck id}
        '409': {description: Deck name already used by this user}
  /learn/decks/{id}:
    put:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Deck'}
      responses:
        '204': {description: Updated}
        '404': {description: Missing or not owned}
    delete:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Deck and its cards deleted}
  /learn/decks/{id}/cards:
    get:
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: due, in: query, schema: {type: boolean}, description: Only cards due for review}
        - {name: pinned, in: query, schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: Cards with optional image_url and SM-2 fields}
    post:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Card'}
                - type: object
                  properties:
                    vocabulary_id: {type: integer, nullable: true, description: Copy word, meaning, IPA, example and image from dictionary when front/back omitted}
      responses:
        '201': {description: Card id}
        '409': {description: Word already in this deck}
  /learn/cards/{id}:
    put:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Card'}
      responses:
        '204': {description: Updated}
    delete:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Deleted}
  /learn/cards/{id}/review:
    post:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quality]
              properties:
                quality: {type: integer, minimum: 0, maximum: 5, description: 'SM-2 recall quality; below 3 resets the card'}
      responses:
        '200': {description: New ease_factor, interval_days, repetitions, due_at}
  /learn/lookups:
    get:
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: Lookup history, most recent first, with linked meaning when available}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword]
              properties:
                keyword: {type: string, maxLength: 150}
                source: {type: string, enum: [DICTIONARY, READING, FLASHCARD], default: DICTIONARY}
      responses:
        '201': {description: 'Upserted row {id, vocabulary_id, lookup_count}; same word (any case) increments the count'}
    delete:
      responses:
        '204': {description: Clear all history of current user}
  /learn/lookups/{id}:
    delete:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Deleted}
  /learn/notifications:
    get:
      parameters:
        - {name: unread, in: query, schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: '{rows,total,unread_count,page,limit}'}
  /learn/notifications/{id}/read:
    patch:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Marked as read}
        '404': {description: Missing or not owned}
  /learn/notifications/read-all:
    post:
      responses:
        '200': {description: '{updated}'}
  /learn/notifications/{id}:
    delete:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Hidden (deleted)}
  /learn/path:
    get:
      summary: Ordered course with the authenticated learner's progress
      responses:
        '200':
          description: Empty units are omitted; no-store personalized response
          content:
            application/json:
              schema:
                type: object
                required: [units, completed, total, current_lesson_id]
                properties:
                  units:
                    type: array
                    items:
                      type: object
                      required: [id, title, description, lessons]
                      properties:
                        id: {type: integer}
                        title: {type: string}
                        description: {type: string}
                        lessons: {type: array, items: {$ref: '#/components/schemas/CourseLesson'}}
                  completed: {type: integer}
                  total: {type: integer}
                  current_lesson_id: {type: integer, nullable: true}
        '401': {description: Authentication required}
  /learn/path/lessons/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Course lesson metadata and content URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseLesson'}
        '401': {description: Authentication required}
        '404': {description: Missing or unpublished lesson}
        '409': {description: Lesson is locked in the course sequence}
        '422': {description: Invalid ID}
  /learn/readings:
    get:
      summary: Published practice reading groups; mock-only material is excluded
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: part_id, in: query, schema: {type: integer, enum: [6, 7]}}
        - name: type
          in: query
          schema:
            type: string
            enum: [EMAIL, LETTER, MEMO, NOTICE, ADVERTISEMENT, ARTICLE, FORM, SCHEDULE, INVOICE, CHAT, WEB_PAGE, REVIEW, OTHER]
        - {name: search, in: query, schema: {type: string, maxLength: 150}}
      responses:
        '200':
          description: One row per group, with exact total even beyond the last page
          content:
            application/json:
              schema:
                type: object
                required: [rows, total, page, limit]
                properties:
                  rows: {type: array, items: {$ref: '#/components/schemas/ReadingSummary'}}
                  total: {type: integer}
                  page: {type: integer}
                  limit: {type: integer}
        '401': {description: Authentication required}
        '422': {description: Invalid filters or pagination}
  /learn/readings/{id}:
    get:
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: translation, in: query, schema: {type: string, enum: ['true', 'false'], default: 'false'}}
      responses:
        '200':
          description: Ordered passages; never contains questions, answer keys or explanations
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ReadingSummary'}
                  - type: object
                    properties:
                      passages:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            position: {type: integer, minimum: 1, maximum: 3}
                            passage_type: {type: string}
                            title: {type: string}
                            content: {type: string}
                            image_url: {type: string, nullable: true}
                            translation_vi: {type: string, description: Only returned when translation=true}
        '401': {description: Authentication required}
        '404': {description: Missing or unpublished practice reading}
        '422': {description: Invalid ID or translation option}
  /learn/readings/{id}/progress:
    put:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [completed]
              properties:
                completed: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Idempotent completion preserves the first completion timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id: {type: integer}
                  completed_at: {type: string, format: date-time}
        '401': {description: Authentication required}
        '404': {description: Missing or unpublished reading}
        '422': {description: Only completed=true is accepted}
  /learn/readings/{id}/lookups:
    post:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [keyword]
              properties:
                keyword: {type: string, minLength: 1, maxLength: 150}
      responses:
        '201':
          description: Exact dictionary matches and one recorded READING lookup; unknown words return empty rows
          content:
            application/json:
              schema:
                type: object
                required: [keyword, rows, lookup]
                properties:
                  keyword: {type: string}
                  rows:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        word: {type: string}
                        ipa: {type: string}
                        part_of_speech: {type: string}
                        meaning_vi: {type: string}
                        definition_en: {type: string}
                        example_sentence: {type: string}
                        audio_url: {type: string, nullable: true}
                        image_url: {type: string, nullable: true}
                        topic: {type: string}
                  lookup:
                    type: object
                    properties:
                      id: {type: integer}
                      vocabulary_id: {type: integer, nullable: true}
                      lookup_count: {type: integer}
        '401': {description: Authentication required}
        '404': {description: Missing or unpublished reading}
        '422': {description: Invalid keyword or word not present in the English passages}

  /learn/{kind}/attempts/{id}/answers:
    patch:
      summary: Save a partial Reading draft before the deadline
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadingDraft'}
      responses:
        '200':
          description: Draft saved; use the returned answer_version for the next write
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  answer_version: {type: integer}
                  deadline_at: {type: string, format: date-time}
                  server_time: {type: string, format: date-time}
        '401': {description: Authentication required}
        '404': {description: Missing or not owned}
        '409': {description: Stale answer_version, submitted attempt or deadline reached}
        '422': {description: Invalid, foreign or duplicate answers}
  /learn/quizzes:
    get:
      summary: Published quiz metadata without questions or answer keys
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: topic_id, in: query, schema: {type: integer, minimum: 1, maximum: 2147483647}}
        - {name: lesson_id, in: query, schema: {type: integer, minimum: 1, maximum: 2147483647}}
        - {name: type, in: query, schema: {type: string, enum: [FILL_BLANK, MATCH, ORDER]}}
      responses:
        '200': {description: '{rows,total,page,limit}; rows have id,title,description,time_limit,vocabulary_topic_id,grammar_lesson_id,question_count,types'}
        '401': {description: Authentication required}
        '422': {description: Invalid filter or pagination}
  /learn/quizzes/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Quiz metadata only; questions are provided through an attempt}
        '404': {description: Missing or unpublished quiz or linked topic/lesson}
  /learn/quizzes/{id}/attempts:
    post:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '201': {description: '{id,started_at,deadline_at,server_time}; stable shuffled snapshot created'}
        '401': {description: Authentication required}
        '404': {description: Missing or unpublished quiz}
        '409': {description: Invalid authored quiz content}
  /learn/quiz/attempts:
    get:
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: content_id, in: query, schema: {type: integer, minimum: 1, maximum: 2147483647}}
        - {name: status, in: query, schema: {type: string, enum: [IN_PROGRESS, SUBMITTED]}}
      responses:
        '200': {description: '{rows,total,page,limit}; own attempts only, newest first, no snapshots or answer keys'}
        '401': {description: Authentication required}
        '422': {description: Invalid filter or pagination}
  /learn/quiz/attempts/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Own attempt; deadline reached finalizes saved answers. Feedback is revealed only for graded questions or after finalization
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt: {type: object, description: Includes result after submission}
                  server_time: {type: string, format: date-time}
                  questions: {type: array, items: {$ref: '#/components/schemas/QuizQuestion'}}
        '401': {description: Authentication required}
        '404': {description: Missing or not owned}
  /learn/quiz/attempts/{id}/answers:
    post:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuizAnswer'}
      responses:
        '200':
          description: First-answer feedback, or identical retry of the previously normalized answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuizFeedback'}
        '401': {description: Authentication required}
        '404': {description: Missing or not owned}
        '409': {description: Already graded with another answer, submitted or expired}
        '422': {description: Answer structure invalid or question not in attempt}
  /learn/quiz/attempts/{id}/submit:
    post:
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                answers: {type: array, maxItems: 50, default: [], items: {$ref: '#/components/schemas/QuizAnswer'}}
      responses:
        '200': {description: '{attempt_id,kind,total_questions,correct_count,accuracy,expired,by_type}; retries return the same immutable result. Late answers are ignored; saved answers are retained'}
        '401': {description: Authentication required}
        '404': {description: Missing or not owned}
        '409': {description: Cannot replace an already graded answer}
        '422': {description: Invalid, duplicate or foreign answers}

components:
  schemas:
    ReadingDraft:
      type: object
      additionalProperties: false
      required: [answer_version, answers]
      properties:
        answer_version: {type: integer, minimum: 0}
        answers:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [question_id]
            anyOf:
              - required: [label]
              - required: [marked_for_review]
            properties:
              question_id: {type: integer, minimum: 1, maximum: 2147483647}
              label: {type: string, enum: [A, B, C, D, null], nullable: true}
              marked_for_review: {type: boolean}
    QuizAnswer:
      type: object
      additionalProperties: false
      required: [question_id, answer]
      properties:
        question_id: {type: integer, minimum: 1, maximum: 2147483647}
        answer:
          oneOf:
            - {type: string, minLength: 1, maxLength: 500, description: FILL_BLANK normalized text}
            - type: object
              additionalProperties: false
              required: [pairs]
              properties:
                pairs:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [left_id, right_id]
                    properties:
                      left_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
                      right_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
            - type: object
              additionalProperties: false
              required: [order]
              properties:
                order:
                  type: array
                  minItems: 2
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
    QuizQuestion:
      type: object
      required: [id, position, type, prompt, payload, answer, feedback]
      properties:
        id: {type: integer}
        position: {type: integer}
        type: {type: string, enum: [FILL_BLANK, MATCH, ORDER]}
        prompt: {type: string}
        payload:
          type: object
          description: 'FILL_BLANK: {text}; MATCH: {left:[{id,text}],right:[{id,text}]}; ORDER: {tokens:[{id,text}]}. No answer key. See B2_2_QUIZ_EXAMS.txt'
        answer: {nullable: true, description: Saved first answer, null when unanswered}
        feedback:
          nullable: true
          allOf: [{$ref: '#/components/schemas/QuizFeedback'}]
    QuizFeedback:
      type: object
      required: [question_id, answer, is_correct, correct_answer, explanation]
      properties:
        question_id: {type: integer}
        answer: {nullable: true, description: Saved normalized answer; null for skipped questions after finalization}
        is_correct: {type: boolean}
        correct_answer: {type: object, description: 'FILL_BLANK: {answers:[string]}; MATCH: {pairs:[{left_id,right_id}]}; ORDER: {order:[token_id]}'}
        explanation: {type: string}

    CourseLesson:
      type: object
      required: [id, title, subtitle, type, content_id, minutes, completed, status, content_url]
      properties:
        id: {type: integer, description: Course lesson ID, distinct from content_id}
        title: {type: string}
        subtitle: {type: string}
        type: {type: string, enum: [VOCABULARY, GRAMMAR, PRACTICE_PART5, READING, MOCK_TEST]}
        content_id: {type: integer, description: READING uses a question group ID}
        minutes: {type: integer, minimum: 1, maximum: 240}
        completed: {type: boolean}
        status: {type: string, enum: [DONE, IN_PROGRESS, LOCKED]}
        content_url: {type: string}
    ReadingSummary:
      type: object
      required: [id, part_id, title, instructions, passage_count, passage_types, completed_at]
      properties:
        id: {type: integer, description: question_groups.id}
        part_id: {type: integer, enum: [6, 7]}
        title: {type: string}
        instructions: {type: string}
        passage_count: {type: integer}
        passage_types: {type: array, items: {type: string}}
        completed_at: {type: string, format: date-time, nullable: true}

    Session:
      type: object
      required: [token, access_token, refresh_token, token_type, expires_in, refresh_expires_in, user]
      properties:
        token: {type: string, description: Backward compatible alias of access_token}
        access_token: {type: string, description: Signed JWT valid for 900 seconds}
        refresh_token: {type: string, minLength: 64, maxLength: 64, description: Rotate and replace after each successful refresh}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, example: 900}
        refresh_expires_in: {type: integer, maximum: 2592000}
        is_new_user: {type: boolean, description: Present for Firebase login}
        user:
          type: object
          properties:
            id: {type: integer}
            email: {type: string, format: email}
            full_name: {type: string}
            role: {type: string, enum: [ADMIN, STUDENT]}
            status: {type: string}
    Deck:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 150}
        description: {type: string}
        cover_image_url: {type: string, format: uri, nullable: true}
    Card:
      type: object
      properties:
        front_text: {type: string, maxLength: 500}
        back_text: {type: string, maxLength: 5000}
        ipa: {type: string}
        example_sentence: {type: string}
        note: {type: string}
        image_url: {type: string, format: uri, nullable: true, description: Optional HTTP(S) image}
        is_pinned: {type: boolean, default: false}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Kind: {name: kind, in: path, required: true, schema: {type: string, enum: [practice,mock]}}
    Id: {name: id, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 2147483647}}
