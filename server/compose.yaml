services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toeic
      POSTGRES_USER: toeic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toeic -d toeic"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DEPLOY_DATABASE_URL:?Set postgresql://toeic:URL-encoded-password@postgres:5432/toeic}
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS public origin}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-TOEIC Administrator}
      TRUST_PROXY: "true"
      SEED_DEMO: "false"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
