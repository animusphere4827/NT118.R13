services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: toeic
      MYSQL_USER: toeic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u toeic toeic -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DEPLOY_DATABASE_URL:?Set mysql://toeic:URL-encoded-password@mysql:3306/toeic}
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS public origin}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-TOEIC Administrator}
      TRUST_PROXY: "true"
      SEED_DEMO: "false"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
