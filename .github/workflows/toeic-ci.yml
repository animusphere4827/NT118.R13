name: TOEIC Studio — Build and API tests
on:
  push:
    paths: ['server/**', '.github/workflows/toeic-ci.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/toeic-ci.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: toeic_test
          POSTGRES_USER: toeic
          POSTGRES_PASSWORD: test-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U toeic -d toeic_test"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: postgresql://toeic:test-database-password@127.0.0.1:5432/toeic_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-strong-password-123
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm content:import
      - run: pnpm course:seed
      - run: pnpm build
      - run: pnpm test
